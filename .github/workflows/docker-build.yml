name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.9)'
        required: true
        default: 'v1.9'
      target_repo:
        description: 'Target Docker Hub Repository'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Variables
        id: vars
        run: |
          # Determine repo
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/wiimnowplaying-test"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.target_repo }}" == "production" ]]; then
              REPO="${{ secrets.DOCKERHUB_USERNAME }}/wiimnowplaying"
            fi
          fi

          # Determine version
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"  # extracts vx.y.z from refs/tags/vx.y.z
          else
            VER="latest"
          fi

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 1: Build and Push AMD64 (+ latest-amd64)
      - name: Build AMD64
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.ver }}-amd64
          build-args: VERSION=${{ steps.vars.outputs.ver }}

      # Step 2: Build and Push ARM64 (+ latest-arm64)
      - name: Build ARM64
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.ver }}-arm64
            ${{ steps.vars.outputs.repo }}:latest-arm64
          build-args: VERSION=${{ steps.vars.outputs.ver }}

      # Step 3: Build Multi-Arch Manifest and Push
      - name: Build Multi-Arch Manifest
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.ver }}
            ${{ steps.vars.outputs.repo }}:latest
          build-args: VERSION=${{ steps.vars.outputs.ver }}